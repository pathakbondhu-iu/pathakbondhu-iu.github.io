<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পাঠকবন্ধু, ইসলামী বিশ্ববিদ্যালয় শাখা</title>
<meta name="description" content="পাঠকবন্ধু, ইসলামী বিশ্ববিদ্যালয় শাখা: অরাজনৈতিক, সেবামূলক ও শিক্ষামূলক সামাজিক সংগঠন। দৈনিক আজকের পত্রিকার সহযোগী সংগঠন।">
<link rel="icon" href="images/pathakbondhu-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --green:#0f6b4f; --dark:#0b3d2e; --gold:#d9a93a; --bg:#f6f8f7; --card:#fff; --text:#1c2a25; --muted:#66756f; --line:#dfe6e3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.75; }
  h1,h2,h3,.brand { font-family:"Tiro Bangla","Hind Siliguri",serif; font-weight:400; }

  /* হেডার */
  header { background:linear-gradient(135deg,var(--dark),var(--green)); color:#fff; padding:28px 16px 30px; text-align:center; position:relative; }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--gold),#f3d98a,var(--gold)); }
  .logo-main { height:110px; width:auto; max-width:80%; display:block; margin:0 auto 10px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  header h1 { margin:0; font-size:2.3rem; letter-spacing:.5px; }
  header .branch { margin:2px 0 0; font-size:1.2rem; color:#f3d98a; font-family:"Tiro Bangla",serif; }
  header .about { margin:10px auto 0; max-width:640px; font-size:1rem; opacity:.92; }

  /* সহযোগী ও বিশ্ববিদ্যালয়ের লোগো-স্ট্রিপ */
  .partners { display:flex; justify-content:center; align-items:center; gap:28px; flex-wrap:wrap; margin-top:18px; }
  .partner { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); border-radius:14px; padding:8px 16px; font-size:.9rem; }
  .partner img { height:44px; width:auto; background:#fff; border-radius:8px; padding:3px; }

  nav { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); z-index:5; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  nav .tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; max-width:960px; margin:auto; }
  nav button { flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--text); padding:6px 18px; border-radius:20px; font:inherit; font-weight:500; cursor:pointer; transition:.15s; }
  nav button:hover { border-color:var(--green); }
  nav button.active { background:var(--green); color:#fff; border-color:var(--green); }

  main { max-width:960px; margin:22px auto; padding:0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:.2s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(15,107,79,.12); }
  .card img { width:100%; height:180px; object-fit:cover; display:block; background:#e8eeeb; }
  .card .body { padding:14px 16px 16px; }
  .tag { display:inline-block; font-size:.78rem; font-weight:600; background:#e3f2ec; color:var(--green); padding:1px 11px; border-radius:12px; }
  .date { font-size:.8rem; color:var(--muted); margin-left:6px; }
  .card h3 { margin:8px 0 4px; font-size:1.15rem; line-height:1.5; }
  .card p { margin:0; color:var(--muted); font-size:.94rem; white-space:pre-line; }
  .card a.more { display:inline-block; margin-top:8px; color:var(--green); font-weight:600; cursor:pointer; font-size:.92rem; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }

  /* ফুটার */
  footer { background:var(--dark); color:#cfe3da; text-align:center; font-size:.9rem; padding:28px 16px 34px; margin-top:30px; }
  footer .flogos { display:flex; justify-content:center; align-items:center; gap:18px; margin-bottom:12px; flex-wrap:wrap; }
  footer .flogos img { height:48px; width:auto; background:#fff; border-radius:8px; padding:4px; }
  footer a { color:var(--gold); font-weight:600; }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:20px 12px; z-index:10; }
  #modal.open { display:flex; }
  #modal .box { background:#fff; max-width:680px; width:100%; border-radius:14px; padding:18px; }
  #modal img { width:100%; border-radius:8px; margin:8px 0; }
  #modal .text { white-space:pre-line; }
  #modal button.close { float:right; border:0; background:#eee; border-radius:8px; padding:4px 12px; font:inherit; cursor:pointer; }
  @media (max-width:520px) { header h1 { font-size:1.9rem; } .logo-main { height:90px; } }
</style>
</head>
<body>
<header>
  <img class="logo-main" src="images/pathakbondhu-logo.png" alt="পাঠকবন্ধু লোগো" onerror="this.style.display='none'">
  <h1>পাঠকবন্ধু</h1>
  <p class="branch">ইসলামী বিশ্ববিদ্যালয় শাখা</p>
  <p class="about">অরাজনৈতিক, সেবামূলক ও শিক্ষামূলক সামাজিক সংগঠন</p>
  <div class="partners">
    <div class="partner">
      <img src="images/iu-logo.png" alt="ইসলামী বিশ্ববিদ্যালয় লোগো" onerror="this.style.display='none'">
      <span>ইসলামী বিশ্ববিদ্যালয়</span>
    </div>
    <div class="partner">
      <img src="images/ajkerpatrika-logo.png" alt="দৈনিক আজকের পত্রিকা লোগো" onerror="this.style.display='none'">
      <span>দৈনিক আজকের পত্রিকার<br>সহযোগী সংগঠন</span>
    </div>
  </div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main>
  <div class="grid" id="list"></div>
  <div class="empty" id="empty" style="display:none">এই ক্যাটাগরিতে এখনো কোনো পোস্ট নেই।</div>
</main>
<footer>
  <div class="flogos">
    <img src="images/pathakbondhu-logo.png" alt="" onerror="this.style.display='none'">
    <img src="images/iu-logo.png" alt="" onerror="this.style.display='none'">
    <img src="images/ajkerpatrika-logo.png" alt="" onerror="this.style.display='none'">
  </div>
  &copy; পাঠকবন্ধু, ইসলামী বিশ্ববিদ্যালয় শাখা<br>
  দৈনিক আজকের পত্রিকার সহযোগী সংগঠন<br>
  <a id="fblink" href="#" target="_blank" rel="noopener">আমাদের ফেসবুক পেইজ</a>
</footer>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ===== সেটিংস =====
var FACEBOOK_PAGE_URL = "https://www.facebook.com/pathakbondhu.iu";
var CATEGORIES = ["সব","খবর","ইভেন্ট","ঘোষণা","সেবামূলক কাজ","শিক্ষামূলক","গ্যালারি","সাধারণ"];
// ==================

document.getElementById("fblink").href = FACEBOOK_PAGE_URL;
var posts = [];
var current = decodeURIComponent(location.hash.slice(1)) || "সব";

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtDate(s) {
  var d = new Date(s);
  if (isNaN(d)) return "";
  return d.toLocaleDateString("bn-BD", { year:"numeric", month:"long", day:"numeric" });
}
function safeUrl(u) { return /^(https?:\/\/|\/|\.\/|images\/)/.test(u || "") ? u : ""; }

function renderTabs() {
  var box = document.getElementById("tabs");
  box.textContent = "";
  CATEGORIES.forEach(function (c) {
    var b = el("button", c === current ? "active" : "", c);
    b.onclick = function () { current = c; location.hash = encodeURIComponent(c); render(); };
    box.appendChild(b);
  });
}
function render() {
  renderTabs();
  var list = document.getElementById("list");
  list.textContent = "";
  var shown = posts.filter(function (p) { return current === "সব" || p.category === current; });
  document.getElementById("empty").style.display = shown.length ? "none" : "block";
  shown.forEach(function (p) {
    var card = el("div", "card");
    var img = safeUrl((p.images || [])[0]);
    if (img) { var i = el("img"); i.src = img; i.alt = p.title || ""; i.loading = "lazy"; card.appendChild(i); }
    var body = el("div", "body");
    body.appendChild(el("span", "tag", p.category || "সাধারণ"));
    body.appendChild(el("span", "date", fmtDate(p.date)));
    body.appendChild(el("h3", "", p.title || ""));
    var t = p.text || "";
    body.appendChild(el("p", "", t.length > 140 ? t.slice(0, 140) + "…" : t));
    var more = el("a", "more", "বিস্তারিত পড়ুন");
    more.onclick = function () { openPost(p); };
    body.appendChild(more);
    card.appendChild(body);
    list.appendChild(card);
  });
}
function openPost(p) {
  var box = document.getElementById("modalBox");
  box.textContent = "";
  var c = el("button", "close", "বন্ধ করুন");
  c.onclick = closeModal;
  box.appendChild(c);
  box.appendChild(el("span", "tag", p.category || "সাধারণ"));
  box.appendChild(el("span", "date", fmtDate(p.date)));
  box.appendChild(el("h2", "", p.title || ""));
  box.appendChild(el("div", "text", p.text || ""));
  (p.images || []).forEach(function (u) {
    u = safeUrl(u);
    if (u) { var i = el("img"); i.src = u; i.loading = "lazy"; box.appendChild(i); }
  });
  var fb = safeUrl(p.fb_url);
  if (fb) { var a = el("a", "", "ফেসবুকে দেখুন"); a.href = fb; a.target = "_blank"; a.rel = "noopener"; box.appendChild(a); }
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").onclick = function (e) { if (e.target.id === "modal") closeModal(); };

fetch("data/posts.json")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    posts = d.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    render();
  })
  .catch(function () { render(); });
</script>
</body>
</html>
