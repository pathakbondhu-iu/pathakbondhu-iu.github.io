name: Facebook Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/sync.py

      - name: Commit changes
        run: |
          git config user.name "pathakbondhu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json images/posts || true
          if git diff --cached --quiet; then
            echo "কোনো নতুন পরিবর্তন নেই"
          else
            git commit -m "ফেসবুক থেকে নতুন পোস্ট যোগ"
            git push
          fi
