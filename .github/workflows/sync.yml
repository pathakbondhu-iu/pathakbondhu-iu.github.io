name: Facebook Sync and Build

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/posts.json"
      - "data/committee.json"
      - "site.json"
      - "images/**"
      - "scripts/build.py"

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Facebook sync
        if: github.event_name != 'push'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/sync.py

      - name: Build site
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "pathakbondhu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "কোনো নতুন পরিবর্তন নেই"
          else
            git commit -m "সাইট আপডেট"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
